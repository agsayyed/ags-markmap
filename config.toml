[module]
[module.hugoVersion]
extended = true
min = "0.110.0"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets/hb/modules/ags-markmap"
target = "assets/hb/modules/ags-markmap"

[params.hb.ags_markmap]
enable = true
placement = "top"
height = "400px"
autoFit = true
duration = 400

# HugoPress module configuration
[params.hugopress.modules.ags-markmap.hooks.head-end]
weight = 10

[params.hugopress.modules.ags-markmap.hooks.body-begin]
weight = 10
